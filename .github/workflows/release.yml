name: Release

# 打 tag（v*）触发，或手动运行（Actions → Release → Run workflow）。
# 需要先在仓库 Settings → Secrets and variables → Actions 配置证书相关 Secrets，
# 清单见 docs/ci-signing.md。未配置签名 Secrets 时会自动降级为 ad-hoc 签名构建。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      skip_notarization:
        description: "跳过公证（notarization）"
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # 创建 GitHub Release 并上传产物

jobs:
  build-macos:
    name: Build & Sign macOS App
    runs-on: macos-15
    env:
      APP_NAME: zappale
      # 证书 Secrets 是否已配置（secrets 不能直接进 if，经 env 中转）
      HAS_CERT: ${{ secrets.MACOS_CERTIFICATE_P12 != '' && secrets.MACOS_CERTIFICATE_PASSWORD != '' && secrets.SIGNING_IDENTITY != '' }}
      HAS_NOTARY: ${{ secrets.APPLE_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      # ── 导入签名证书到临时钥匙串 ─────────────────────────────────────────
      # MACOS_CERTIFICATE_P12 = 开发者证书（含私钥）导出 .p12 后 base64 编码
      # MACOS_CERTIFICATE_PASSWORD = 导出 .p12 时设置的密码
      - name: Import signing certificate
        if: env.HAS_CERT == 'true'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail

          CERTIFICATE_PATH="$RUNNER_TEMP/signing-cert.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          # base64 → p12
          echo -n "$MACOS_CERTIFICATE_P12" | base64 --decode -o "$CERTIFICATE_PATH"

          # 每次运行生成随机钥匙串密码（未配置 KEYCHAIN_PASSWORD Secrets 时兜底）
          KC_PASSWORD="${KEYCHAIN_PASSWORD:-$(openssl rand -hex 32)}"

          # 创建临时钥匙串并设为默认
          security -v create-keychain -p "$KC_PASSWORD" "$KEYCHAIN_PATH"
          security -v set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security -v unlock-keychain -p "$KC_PASSWORD" "$KEYCHAIN_PATH"
          security -v list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security -v default-keychain -s "$KEYCHAIN_PATH"

          # 导入证书，允许 codesign 访问
          security -v import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          # 解决 UI 提示弹窗：对钥匙串内所有证书信任 codesign
          security -v set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PASSWORD" "$KEYCHAIN_PATH"

          # 验证证书就位
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      # ── 构建 + 正式签名 ────────────────────────────────────────────────
      - name: Build & sign app (certificate)
        if: env.HAS_CERT == 'true'
        env:
          SIGN_IDENTITY: ${{ secrets.SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: ./scripts/build-app.sh

      - name: Build app (ad-hoc fallback)
        if: env.HAS_CERT != 'true'
        run: |
          echo "::warning::未配置签名 Secrets，本次构建为 ad-hoc 签名（不可分发）"
          ./scripts/build-app.sh

      # ── 公证（notarization，仅 Developer ID 证书时有意义）────────────────
      - name: Notarize & staple
        if: env.HAS_CERT == 'true' && env.HAS_NOTARY == 'true' && inputs.skip_notarization != true
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          ZIP="$RUNNER_TEMP/${APP_NAME}-notary.zip"
          ditto -c -k --keepParent "build/${APP_NAME}.app" "$ZIP"

          # notarytool 凭据写入后提交公证并等待完成
          xcrun notarytool store-credentials "notary-profile" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID"
          xcrun notarytool submit "$ZIP" --keychain-profile "notary-profile" --wait

          xcrun stapler staple "build/${APP_NAME}.app"
          spctl -a -t exec -vv "build/${APP_NAME}.app" || true

      # ── 打包上传 ────────────────────────────────────────────────────────
      - name: Zip app bundle
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF" == refs/tags/* ]] || VERSION="untagged-$(git rev-parse --short HEAD)"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          ditto -c -k --keepParent "build/${APP_NAME}.app" "$RUNNER_TEMP/${APP_NAME}-${VERSION}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zappale-macos-${{ env.APP_VERSION }}
          path: ${{ runner.temp }}/${{ env.APP_NAME }}-${{ env.APP_VERSION }}.zip
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ runner.temp }}/${{ env.APP_NAME }}-${{ env.APP_VERSION }}.zip
          generate_release_notes: true

      # ── 清理钥匙串 ──────────────────────────────────────────────────────
      - name: Cleanup keychain
        if: always()
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          if [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
